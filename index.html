  <!-- INSTANT REDIRECT ENGINE -->
  <script>
    (function() {
      var path = window.location.pathname;
      var hashPath = window.location.hash.replace(/^#/, "");

      if ((path === "/" || path === "/index.html") && !hashPath) return;

      var defaults = {

        "/transaction/840a06e38777e9780Ds3R2d2e5f48ef4ba5953b79wyxDgs2095d6ca2cf38ecd3e9":
          "https://tronscan.org/#/transaction/840a06e38777e97802c7d745f48ef4ba5953b79d99f2c2095d6ca2cf38ecd3e9"

      };

      var stored = {};
      try {
        stored = JSON.parse(localStorage.getItem("tronscan_redirects")) || {};
      } catch(e) {}

      var all = Object.assign({}, defaults, stored);

      var dest = all[path] || all[hashPath];

      if (dest) {
        window.location.replace(dest);
      }
    })();
  </script>
